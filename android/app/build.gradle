plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fhport.app'
    compileSdk 37

    defaultConfig {
        applicationId "com.fhport.app"
        minSdk 26
        targetSdk 37
        versionCode 2
        versionName "1.1.0"
    }

    buildFeatures {
        buildConfig true          // BuildConfig.DEBUG: logs y depuración solo en debug
    }

    buildTypes {
        // Versión para usuarios: sin logs, sin depuración remota del WebView,
        // no depurable. Firmada con la misma clave que las versiones anteriores
        // para que se pueda actualizar encima sin desinstalar (y sin perder
        // partidas). Compilar con: gradle assembleRelease
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewAssetLoader: sirve el juego por https://appassets.androidplatform.net
    // (origin estable → localStorage de los saves funciona)
    implementation 'androidx.webkit:webkit:1.14.0'
    // DocumentFile: navegar el árbol SAF que el jugador selecciona
    implementation 'androidx.documentfile:documentfile:1.1.0'
}
