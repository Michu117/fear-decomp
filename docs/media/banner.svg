<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="Fear &amp; Hunger — Android Port">
  <!-- Original artwork for the README (no game assets). Torch reused from assets/gen/icon/icon-torch.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0a12"/>
      <stop offset="55%" stop-color="#15101c"/>
      <stop offset="100%" stop-color="#07060a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8a1e" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ff6a10" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff6a10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d4c2d"/>
      <stop offset="45%" stop-color="#4b3321"/>
      <stop offset="100%" stop-color="#221610"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#525863"/>
      <stop offset="100%" stop-color="#23262d"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2433" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2a2433" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1280" height="380" rx="18" fill="url(#bg)"/>
  <rect x="6" y="6" width="1268" height="368" rx="14" fill="none" stroke="#7a6f5a" stroke-opacity="0.45" stroke-width="2"/>

  <!-- drifting fog -->
  <g filter="url(#soft)" opacity="0.7">
    <ellipse cx="300" cy="330" rx="420" ry="46" fill="#3a3145">
      <animate attributeName="cx" values="260;360;260" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="980" cy="345" rx="460" ry="40" fill="#2f2838">
      <animate attributeName="cx" values="1020;900;1020" dur="22s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <rect y="230" width="1280" height="150" rx="18" fill="url(#fog)"/>

  <!-- torch (scaled from the app icon) -->
  <g transform="translate(70,10) scale(0.62)">
    <circle cx="512" cy="380" r="260" fill="url(#glow)">
      <animate attributeName="r" values="250;272;244;266;250" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;1;0.8;1;0.9" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="scale" additive="sum" values="1 1;1.02 0.97;0.99 1.03;1 1" dur="1.4s" repeatCount="indefinite"/>
      <path d="M512,232 C564,286 588,340 578,386 C568,432 542,456 512,456 C478,456 450,428 446,384 C441,336 468,286 512,232 Z" fill="#ff7b1c"/>
      <path d="M512,284 C550,330 566,368 558,402 C550,436 533,454 512,454 C488,454 469,436 465,404 C460,368 482,330 512,284 Z" fill="#ffb52e"/>
      <path d="M512,336 C538,368 548,396 542,418 C536,440 524,452 512,452 C497,452 486,441 482,420 C477,396 491,368 512,336 Z" fill="#ffe27a"/>
      <path d="M512,384 C527,404 532,422 528,434 C524,445 518,452 512,452 C504,452 499,445 496,435 C492,421 499,403 512,384 Z" fill="#fff3c4"/>
    </g>
    <circle cx="536" cy="286" r="7" fill="#ffcf6b">
      <animate attributeName="cy" values="300;200;300" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="487" cy="264" r="5" fill="#ffcf6b">
      <animate attributeName="cy" values="290;170;290" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <rect x="468" y="446" width="88" height="17" rx="7" fill="#5a616c"/>
    <path d="M476,461 L548,461 L536,517 L488,517 Z" fill="url(#metal)" stroke="#181a1f" stroke-width="4"/>
    <rect x="491" y="510" width="42" height="200" rx="12" fill="url(#wood)"/>
    <rect x="486" y="566" width="52" height="15" rx="6" fill="#170f09"/>
    <rect x="486" y="602" width="52" height="15" rx="6" fill="#170f09"/>
    <rect x="486" y="638" width="52" height="15" rx="6" fill="#170f09"/>
  </g>

  <!-- title -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#e8d9b0">
    <text x="520" y="150" font-size="76" letter-spacing="6">FEAR &amp; HUNGER</text>
    <text x="524" y="200" font-size="26" letter-spacing="14" fill="#c9a76a">ANDROID PORT</text>
    <line x1="524" y1="226" x2="1180" y2="226" stroke="#7a6f5a" stroke-opacity="0.6"/>
    <text x="524" y="268" font-size="24" fill="#d8cfb8">Your copy · your phone · zero game files inside</text>
    <text x="524" y="304" font-size="24" fill="#a89f88" font-style="italic">Tu copia · tu teléfono · cero archivos del juego</text>
  </g>
</svg>
